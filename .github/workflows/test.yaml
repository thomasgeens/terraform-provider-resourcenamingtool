# Terraform Provider testing workflow.
name: CI - Build, SAST, Docs, Unit & AcceptanceTests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Provider changes
      - go.mod
      - go.sum
      - main.go
      - docs/**
      - examples/**
      - internal/**
      - tools/**
      - terraform-registry-manifest.json
      # CI changes
      - .goreleaser.yaml # GoReleaser configuration changes
      # Licensing changes
      - .copywrite.hcl # Copywrite configuration changes
      - LICENSE # License changes

  push:
    branches:
      - main
    paths:
      # Provider changes
      - go.mod
      - go.sum
      - main.go
      - docs/**
      - examples/**
      - internal/**
      - tools/**
      - terraform-registry-manifest.json
      # CI changes
      - .goreleaser.yaml # GoReleaser configuration changes
      # Licensing changes
      - .copywrite.hcl # Copywrite configuration changes
      - LICENSE # License changes

# Testing only needs permissions to read the repository contents.
permissions:
  actions: read
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build, Unit tests and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest

  generate:
    name: Generate Docs, License, Terraform Reg Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
        env:
          GOTOOLCHAIN: auto
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit again."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform v:{{ matrix.terraform }} Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - 1.8.*
          - 1.9.*
          - 1.10.*
          - 1.11.*
          - 1.12.*
          - 1.13.*
          - 1.14.*
          - 1.15.*
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Download Go modules
        run: go mod download
      - name: Terraform {{ matrix.terraform }} acceptance tests
        env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
