name: CI - Auto-generate Docs (Dependabot)
run-name: Auto-generate Docs <${{ github.ref_name }}>

# Runs on every Dependabot push. Regenerates docs via `make generate` and
# commits back if the new tool version produces different output — prevents
# the generate job in test.yaml from failing with a stale-docs diff.
on:
  push:
    branches:
      - dependabot/**

permissions:
  contents: read

concurrency:
  group: auto-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-generate:
    name: Auto-generate Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: true # required: git push uses the GITHUB_TOKEN credential

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: make generate
        env:
          GOTOOLCHAIN: auto

      - name: Commit generated docs if changed
        run: |
          if git diff --quiet; then
            echo "No documentation changes — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(docs): regenerate docs after dependency update"
          git push
