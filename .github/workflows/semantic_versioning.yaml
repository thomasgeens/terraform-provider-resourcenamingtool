# Terraform Provider semantic versioning workflow.
name: CD - Create semantic version (tag)

# This GitHub action initiates semantic versioning for each pull request to the default branch in normal mode (CI).
# It can can also be triggered manually to create a new release candidate, and with a manual dry-run option.
on:
  pull_request:
    branches:
      - main
      - beta
      - alpha
      - next
      - next-major
    types: [opened, synchronize, reopened]
    paths:
      # Provider changes
      - go.mod
      - go.sum
      - main.go
      - docs/**
      - examples/**
      - internal/**
      - tools/**
      - terraform-registry-manifest.json
      # CI changes
      - .goreleaser.yaml # GoReleaser configuration changes
      # Licensing changes
      - .copywrite.hcl # Copywrite configuration changes
      - LICENSE # License changes
  workflow_dispatch:
    inputs:
      # trunk-ignore(checkov/CKV_GHA_7)
      dry_run:
        description: Run in dry-run mode
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - beta
      - alpha
      - next
      - next-major
    paths:
      # Provider changes
      - go.mod
      - go.sum
      - main.go
      - docs/**
      - examples/**
      - internal/**
      - tools/**
      - terraform-registry-manifest.json
      # CI changes
      - .goreleaser.yaml # GoReleaser configuration changes
      # Licensing changes
      - .copywrite.hcl # Copywrite configuration changes
      - LICENSE # License changes

permissions:
  contents: read

env:
  # This environment variable is used to determine if the workflow is running in dry-run mode or not.
  # We run in dry-run mode when the workflow is triggered manually with the input dry_run enabled,
  # or when the path is one of the following:
  #   - .github/workflows/semantic_versioning.yaml
  #   - .releaserc
  DRY_RUN: ${{ github.event.inputs.dry_run || github.event_name == 'pull_request' || false }}

jobs:
  semantic_versioning:
    name: Semantic Versioning
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_release_git_tag: ${{ steps.set_output.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report dry-run mode
        env:
          IS_DRY_RUN: ${{ env.DRY_RUN }}
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "Running in dry-run mode"
          else
            echo "Running in normal mode (CI)"
          fi
      - name: Temporarily merge PR branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          ESCAPED_BRANCH="${PR_HEAD_REF//\"/\\\"}"
          ESCAPED_TITLE="${PR_TITLE//\"/\\\"}"
          git fetch origin "${ESCAPED_BRANCH}"
          git merge --no-ff "origin/${ESCAPED_BRANCH}" -m "${ESCAPED_TITLE}"
      - name: Semantic Release
        id: semantic
        # trunk-ignore(zizmor/unpinned-uses): cycjimmy doesn't publish verifiable commit SHAs alongside tags
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24.2.3
          dry_run: ${{ env.DRY_RUN }}
          unset_gha_env: ${{ github.event_name == 'pull_request' }}
          ci: ${{ github.event_name == 'pull_request' && false || '' }}
          # You can specify specifying version range for the extra plugins if you prefer.
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semantic Release Output
        env:
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          NEW_RELEASE_MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
          NEW_RELEASE_MINOR: ${{ steps.semantic.outputs.new_release_minor_version }}
          NEW_RELEASE_PATCH: ${{ steps.semantic.outputs.new_release_patch_version }}
          NEW_RELEASE_CHANNEL: ${{ steps.semantic.outputs.new_release_channel }}
          NEW_RELEASE_NOTES: ${{ steps.semantic.outputs.new_release_notes }}
          NEW_RELEASE_GIT_HEAD: ${{ steps.semantic.outputs.new_release_git_head }}
          NEW_RELEASE_GIT_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          LAST_RELEASE_VERSION: ${{ steps.semantic.outputs.last_release_version }}
          LAST_RELEASE_GIT_HEAD: ${{ steps.semantic.outputs.last_release_git_head }}
          LAST_RELEASE_GIT_TAG: ${{ steps.semantic.outputs.last_release_git_tag }}
        run: |
          echo "Semantic Release Outputs:"
          echo "New release published: $NEW_RELEASE_PUBLISHED"
          echo "New release version: $NEW_RELEASE_VERSION"
          echo "New release major version: $NEW_RELEASE_MAJOR"
          echo "New release minor version: $NEW_RELEASE_MINOR"
          echo "New release patch version: $NEW_RELEASE_PATCH"
          echo "New release channel: $NEW_RELEASE_CHANNEL"
          echo "New release notes: $NEW_RELEASE_NOTES"
          echo "New release git head: $NEW_RELEASE_GIT_HEAD"
          echo "New release git tag: $NEW_RELEASE_GIT_TAG"
          echo "Last release version: $LAST_RELEASE_VERSION"
          echo "Last release git head: $LAST_RELEASE_GIT_HEAD"
          echo "Last release git tag: $LAST_RELEASE_GIT_TAG"
      - name: Set jobs tag output
        id: set_output
        env:
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_RELEASE_GIT_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          if [ "$NEW_RELEASE_PUBLISHED" == "true" ]; then
            echo "new_release_git_tag=$NEW_RELEASE_GIT_TAG" >> $GITHUB_OUTPUT
          else
            echo "new_release_git_tag=" >> $GITHUB_OUTPUT
          fi

  call_release:
    name: Call workflow CD - Create version release package
    needs: semantic_versioning
    permissions:
      contents: write
    if: needs.semantic_versioning.outputs.new_release_git_tag != ''
    uses: ./.github/workflows/release.yaml
    with:
      new_release_git_tag: ${{ needs.semantic_versioning.outputs.new_release_git_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
