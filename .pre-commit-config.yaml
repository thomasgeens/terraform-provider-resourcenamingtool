---
repos:
  - repo: local
    hooks:
      - id: clean-clutter
        name: Clean up clutter
        entry: make clean
        language: system
        pass_filenames: false
      - id: add-headers
        name: Add copyright headers
        description: Adds missing copyright headers to all source code files
        entry: copywrite headers
        language: system
        pass_filenames: false
      - id: check-headers
        name: Validate copyright headers
        description: Checks if any copyright headers are missing, but does not make changes
        entry: copywrite headers --plan
        language: system
        pass_filenames: false
      - id: add-license
        name: Add or fix repo license
        description: Adds or updates a non-compliant LICENSE file
        entry: copywrite license
        language: system
        pass_filenames: false
      - id: check-license
        name: Validate repo license
        description: Checks if a LICENSE file is valid, but does not make changes
        entry: copywrite license --plan
        language: system
        pass_filenames: false
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v5.0.0
  #   hooks:
  #     - id: check-yaml
  #     - id: end-of-file-fixer
  #     # exclude: ^directory/file
  #     - id: trailing-whitespace
  #     # exclude: ^directory/file
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
        exclude: ^tools/tools.go
      - id: go-imports
      - id: go-cyclo
        args: [-over=200]
      - id: validate-toml
      - id: no-go-testing
      - id: golangci-lint
      # Disabling until gocritic fixes the "Unexpected package creation during export data loading"
      # error that shows up when using packages containing generics
      # - id: go-critic
      - id: go-unit-tests
      - id: go-build
      - id: go-mod-tidy
  - repo: local
    hooks:
      - id: docs-generate-check
        name: Check generated docs are up to date
        description: Runs make generate and fails if docs/ changed. Run 'make generate && git add docs/ && git commit --amend' to fix.
        entry: >-
          bash -c
          "make generate && git diff --exit-code docs/ ||
          (echo 'Docs out of sync. Run: make generate && git add docs/ && git commit --amend' && exit 1)"
        language: system
        pass_filenames: false
        files: ^(examples/|internal/provider/descriptions/|internal/provider/.*\.go|main\.go)
      - id: go-sec
        name: GoSec
        description: Run GoSec security analysis
        entry: gosec ./...
        # args: ['-fmt=json', '-out=gosec.json', '-exclude=G101,G102,G104,G107,G201,G202,G203,G204,G501']
        language: system
        pass_filenames: false
      - id: clean-clutter
        name: Clean up clutter
        entry: make clean
        language: system
        pass_filenames: false
